services:
  migrate:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be configured}
    command: [ "python", "scripts/init_db.py" ]
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
    restart: "no"

  app:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be configured}
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be configured}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be configured}
      DOCUMENT_STORAGE_PATH: /app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - document_storage:/app/data/documents
    restart: unless-stopped

  worker:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be configured}
    command: [ "python", "scripts/worker.py" ]
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be configured}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be configured}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be configured}
      DOCUMENT_STORAGE_PATH: /app/data/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - document_storage:/app/data/documents
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must be configured}
    ports:
      - "3000:3000"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  document_storage:
